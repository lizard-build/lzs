name: Release

# Publishes to npm when package.json's version is not on npm yet (npm trusted publishing: no
# token, provenance from this workflow), then tags it. Actions are pinned to commit SHAs.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the v<version> tag
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check
        run: node --check lzs && node lzs --version && test "$(node lzs --version)" = "$(node -p "require('./package.json').version")"
      - name: Publish if new
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$(npm view "@lizard-build/lzs@$V" version 2>/dev/null)" = "$V" ]; then
            echo "@lizard-build/lzs@$V is already on npm"
          else
            # The first release is published by hand (trusted publishing needs the package to exist).
            if ! npm view @lizard-build/lzs version >/dev/null 2>&1; then echo "::notice::@lizard-build/lzs is not on npm yet: publish the first version by hand"; exit 0; fi
            npm install -g npm@11.21.3
            npm publish --access public --provenance
          fi
          if ! git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then git tag "v$V" && git push origin "v$V"; fi
